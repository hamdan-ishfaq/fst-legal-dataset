# Pinned model runtime and weights. scripts/fetch_runtime.py downloads these into runtime/.
# Every node in the cluster must run the same versions (Decision D-002).

[llama_cpp]
tag = "b12588"
assets = [
    "llama-b12588-bin-win-cuda-13.5-x64.zip",
    "cudart-llama-bin-win-cuda-13.5-x64.zip",
]

[models.embedding]
repo = "Qwen/Qwen3-Embedding-0.6B-GGUF"
revision = "main"
files = ["Qwen3-Embedding-0.6B-Q8_0.gguf"]

[models.rlm]
