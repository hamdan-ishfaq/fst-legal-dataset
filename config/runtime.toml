# Pinned model runtime and weights. scripts/fetch_runtime.py downloads these into runtime/.
# Every node in the cluster must run the same versions (Decision D-002).

[llama_cpp]
tag = "b12588"
assets = [
    "llama-b12588-bin-win-cuda-13.5-x64.zip",
    "cudart-llama-bin-win-cuda-13.5-x64.zip",
]

[models.embedding]
repo = "Qwen/Qwen3-Embedding-0.6B-GGUF"
revision = "main"
files = ["Qwen3-Embedding-0.6B-Q8_0.gguf"]

[models.rlm]
# Official bf16 weights; converted and quantized locally (scripts/quantize_rlm.py)
repo = "mit-oasys/rlm-qwen3-8b-v0.1"
revision = "171c96639865d559206cd7ef78c4d8188a91992a"
files = [
    "config.json", "generation_config.json", "tokenizer.json", "tokenizer_config.json",
    "special_tokens_map.json", "added_tokens.json", "vocab.json", "merges.txt",
    "chat_template.jinja", "model.safetensors.index.json",
    "model-00001-of-00004.safetensors", "model-00002-of-00004.safetensors",
    "model-00003-of-00004.safetensors", "model-00004-of-00004.safetensors",
]

[models.qwen3_8b]
# Base Qwen3-8B: fallback model and the "without RLM fine-tune" comparison (D-002, H4)
repo = "Qwen/Qwen3-8B-GGUF"
revision = "7c41481f57cb95916b40956ab2f0b139b296d974"
files = ["Qwen3-8B-Q4_K_M.gguf"]

[models.rlm_community]
# Community Q4_K_M of the RLM fine-tune, for early tests until scripts/quantize_rlm.py exists
repo = "mitkox/rlm-qwen3-8b-v0.1-Q4_K_M-GGUF"
revision = "4220f0c145a93a897f6b12ea019ae005898dbda9"
files = ["rlm-qwen3-8b-v0.1-q4_k_m.gguf"]

# llama-server settings for the reference laptop (RTX 4050, 6 GB VRAM).
[serve.chat]
model = "qwen3_8b"            # key under [models]; switch to the quantized RLM model when built
port = 8080
ctx_size = 8192
gpu_layers = 99               # all 36 layers fit in 6 GB at this context size
parallel = 1                  # server slots; 2 is the one-node control for H2
extra = ["--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--jinja", "--load-mode", "none"]

[serve.embedding]
model = "embedding"
port = 8081
ctx_size = 2048
gpu_layers = 0                # embeddings run on the CPU so the chat model keeps the GPU
parallel = 2
extra = ["--embedding", "--pooling", "last"]
