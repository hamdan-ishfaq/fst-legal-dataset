[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fstlegal"
version = "0.1.0"
description = "Case-preparation assistant for Federal Service Tribunal practice"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["fstlegal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data: needs the local corpus sources",
    "model: needs a running llama-server",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
